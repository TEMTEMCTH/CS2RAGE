<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2RAGE — Скинченджер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .skinchanger-wrapper { max-width: 1600px; margin: 0 auto; padding: 2rem; animation: fadeInUp 0.5s ease forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        header.site { position: sticky !important; top: 0 !important; z-index: 1000 !important; }
        .breadcrumb { margin-bottom: 2rem; }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb span { color: var(--primary); }
        .skinchanger-layout { display: flex; gap: 2rem; flex-wrap: wrap; }
        .weapon-sidebar {
            flex: 0 0 420px;
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }
        .weapon-sidebar::-webkit-scrollbar { width: 5px; }
        .weapon-sidebar::-webkit-scrollbar-track { background: rgba(42, 42, 42, 0.5); border-radius: 10px; }
        .weapon-sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .weapon-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); }
        .weapon-sidebar-header h3 { font-family: 'Oswald', sans-serif; font-size: 1.2rem; text-transform: uppercase; color: var(--primary); margin: 0; }
        .collection-btn {
            background: linear-gradient(135deg, #c0702a, #f0a050);
            border: none;
            border-radius: 30px;
            padding: 0.6rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .collection-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(224,136,58,0.3); }
        .weapon-category { margin-bottom: 1.5rem; }
        .weapon-category-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
        .weapon-category-title i { color: var(--primary); width: 20px; }
        .weapon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
        .weapon-item {
            background: rgba(15, 15, 15, 0.6);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.8rem 0.3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .weapon-icon { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .weapon-icon img { width: 72px; height: 72px; filter: brightness(0.7); transition: all 0.2s; border-radius: 6px; object-fit: contain; }
        .weapon-item:hover { border-color: var(--primary); background: rgba(224,136,58,0.1); }
        .weapon-item:hover .weapon-icon img { filter: brightness(1); }
        .weapon-item.active { border-color: var(--primary); background: linear-gradient(135deg, rgba(224,136,58,0.2), transparent); }
        .weapon-item.active .weapon-icon img { filter: brightness(1); }
        .weapon-item.has-skin .weapon-icon img { filter: brightness(1); border: 2px solid var(--primary); border-radius: 50%; padding: 8px; }
        .weapon-name { font-size: 0.7rem; color: var(--text-muted); text-align: center; margin-top: 0.2rem; }
        .weapon-item.active .weapon-name { color: var(--primary); }
        .weapon-item.has-skin .weapon-name { color: var(--primary); }
        .show-more-btn {
            background: transparent;
            border: 1px dashed var(--border);
            border-radius: 10px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--primary);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .show-more-btn:hover { background: rgba(224,136,58,0.1); }
        .skins-content { flex: 1; min-width: 0; }
        .selected-weapon-title { font-family: 'Oswald', sans-serif; font-size: 1.8rem; text-transform: uppercase; color: var(--primary); margin-bottom: 1.5rem; }
        .skins-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .skin-card {
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .skin-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .skin-card-image { width: 100%; height: 180px; background: linear-gradient(135deg, #1a1a1a, #0f0f0f); display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .skin-card-image img { max-width: 100%; max-height: 150px; transition: transform 0.3s; }
        .skin-card:hover .skin-card-image img { transform: scale(1.05); }
        .skin-card-info { padding: 1rem; border-top: 1px solid var(--border); }
        .skin-card-name { font-family: 'Oswald', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--text); }
        .skin-card-weapon { font-size: 0.7rem; color: var(--primary); text-transform: uppercase; margin-top: 0.3rem; }
        .loader-wrapper { display: flex; justify-content: center; align-items: center; min-height: 400px; flex-direction: column; }
        .loader-spinner { width: 50px; height: 50px; border: 3px solid rgba(224,136,58,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .skin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
        }
        .skin-modal-content {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 90%;
            max-width: 480px;
            padding: 1.5rem;
        }
        .skin-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .skin-modal-header h3 { color: var(--primary); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 1.1rem; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        .modal-close:hover { color: var(--primary); }
        .skin-modal-preview { text-align: center; margin-bottom: 1rem; }
        .skin-modal-preview img { max-width: 100%; max-height: 160px; border-radius: 12px; }
        .skin-modal-info { text-align: center; margin-bottom: 1.2rem; }
        .skin-modal-info h4 { font-size: 0.9rem; }
        .skin-modal-info p { font-size: 0.7rem; color: var(--text-muted); }
        .qualities { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
        .quality-btn {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0.4rem 0.8rem;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        .quality-btn:hover { border-color: var(--primary); color: var(--primary); }
        .quality-btn.active { background: linear-gradient(135deg, #c0702a, #f0a050); border-color: var(--primary); color: #1a1a1a; }
        .pattern-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0.3rem 1rem;
            margin-bottom: 1rem;
        }
        .pattern-control label { font-size: 0.65rem; color: var(--text-muted); }
        .pattern-control input { flex: 1; background: transparent; border: none; color: var(--primary); text-align: center; outline: none; }
        .random-pattern { background: none; border: none; color: var(--primary); cursor: pointer; }
        .stattrak-btn {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0.5rem;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            margin-bottom: 1rem;
            color: var(--text-muted);
        }
        .stattrak-btn.active { background: linear-gradient(135deg, #c0702a, #f0a050); color: #1a1a1a; }
        .modal-apply-btn {
            background: linear-gradient(135deg, #c0702a, #f0a050);
            border: none;
            border-radius: 30px;
            padding: 0.7rem;
            color: #1a1a1a;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .modal-apply-btn:hover { transform: translateY(-2px); }
        .toast-notification {
            position: fixed;
            top: 90px;
            right: 20px;
            background: #1a1a1a;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            z-index: 10000;
            backdrop-filter: blur(12px);
        }
        .collection-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
        }
        .collection-modal-content {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .collection-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .collection-modal-header h3 { color: var(--primary); font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .collection-list { display: flex; flex-direction: column; gap: 0.8rem; }
        .collection-item {
            background: rgba(15, 15, 15, 0.8);
            border-radius: 12px;
            padding: 0.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .collection-item-img { width: 50px; height: 50px; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .collection-item-img img { max-width: 40px; max-height: 40px; }
        .collection-item-info { flex: 1; }
        .collection-item-weapon { font-size: 0.7rem; color: var(--primary); text-transform: uppercase; }
        .collection-stattrak { font-size: 0.6rem; color: #f0a050; margin-left: 0.3rem; }
    </style>
</head>
<body>

<div class="skinchanger-wrapper">
    <div class="breadcrumb">
        <a href="index.html">Главная</a> / <span>Скинченджер</span>
    </div>

    <div class="skinchanger-layout">
        <div class="weapon-sidebar" id="weaponSidebar">
            <div class="weapon-sidebar-header">
                <h3><i class="fas fa-gun"></i> Оружие</h3>
                <button class="collection-btn" id="collectionBtn"><i class="fas fa-star"></i> Моя коллекция</button>
            </div>
            <div id="weaponCategories"></div>
        </div>

        <div class="skins-content">
            <div class="selected-weapon-title" id="selectedWeaponTitle">Выберите оружие</div>
            <div id="skinsContainer">
                <div class="loader-wrapper">
                    <div class="loader-spinner"></div>
                    <p>Загрузка скинов...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/layout.js"></script>
<script>
let allSkins = [];
let currentWeapon = null;
let weaponsList = {};
let userSkins = {};
let hiddenWeapons = {};
let weaponIcons = {};

const WEAR_VALUES = { "Factory New": 0.03, "Minimal Wear": 0.10, "Field-Tested": 0.25, "Well-Worn": 0.40, "Battle-Scarred": 0.75 };
const WEAR_NAMES = ["Factory New", "Minimal Wear", "Field-Tested", "Well-Worn", "Battle-Scarred"];

const CATEGORIES = {
    rifles: { name: "Винтовки", icon: "fas fa-gun", weapons: ["AK-47", "M4A4", "M4A1-S", "Galil AR", "FAMAS", "SG 553", "AUG"] },
    snipers: { name: "Снайперские винтовки", icon: "fas fa-crosshairs", weapons: ["AWP", "SSG 08", "SCAR-20", "G3SG1"] },
    pistols: { name: "Пистолеты", icon: "fas fa-bullseye", weapons: ["Desert Eagle", "USP-S", "Glock-18", "P250", "Tec-9", "Five-SeveN", "CZ75-Auto", "Dual Berettas", "R8 Revolver"] },
    smgs: { name: "Пистолеты-пулемёты", icon: "fas fa-fill-drip", weapons: ["MP9", "MAC-10", "MP7", "UMP-45", "P90", "PP-Bizon", "MP5-SD"] },
    heavy: { name: "Тяжёлое оружие", icon: "fas fa-bomb", weapons: ["Nova", "XM1014", "Sawed-Off", "MAG-7", "M249", "Negev"] },
    knives: { name: "Ножи", icon: "fas fa-gavel", weapons: ["Karambit", "M9 Bayonet", "Butterfly Knife", "Bayonet", "Talon Knife", "Skeleton Knife", "Stiletto Knife", "Huntsman Knife", "Falchion Knife", "Flip Knife", "Gut Knife", "Bowie Knife"] },
    gloves: { name: "Перчатки", icon: "fas fa-hand-peace", weapons: ["Sport Gloves", "Driver Gloves", "Specialist Gloves", "Hand Wraps", "Moto Gloves", "Bloodhound Gloves", "Hydra Gloves", "Broken Fang Gloves"] }
};

function showToast(msg) {
    const existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.innerHTML = `<i class="fas fa-check-circle"></i><div>${msg}</div>`;
    document.body.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
}

async function loadSkins() {
    try {
        const response = await fetch('/api/skins.json');
        let data = await response.json();
        if (Array.isArray(data)) allSkins = data;
        else if (typeof data === 'object') allSkins = Object.values(data);
        
        allSkins.forEach(skin => {
            const weaponName = skin.weapon?.name || skin.weapon_name;
            if (weaponName && weaponName !== 'Unknown' && weaponName !== 'undefined') {
                if (!weaponsList[weaponName]) {
                    weaponsList[weaponName] = [];
                    if (skin.image && !weaponIcons[weaponName]) {
                        weaponIcons[weaponName] = skin.image;
                    }
                }
                weaponsList[weaponName].push(skin);
            }
        });
        
        for (const weapon of Object.keys(weaponsList)) {
            if (!weaponIcons[weapon] && weaponsList[weapon].length > 0) {
                weaponIcons[weapon] = weaponsList[weapon][0].image || '/images/no-image.png';
            }
        }
        
        const firstWeapon = Object.keys(weaponsList)[0];
        if (firstWeapon) {
            currentWeapon = firstWeapon;
            renderWeaponSidebar();
            renderSkinsForWeapon(currentWeapon);
        }
        await loadUserSkins();
    } catch(err) {
        console.error('loadSkins error:', err);
        document.getElementById('skinsContainer').innerHTML = '<div class="loader-wrapper"><div class="loader-spinner"></div><p>❌ Ошибка загрузки скинов</p></div>';
    }
}

function getWeaponIcon(weaponName) {
    return weaponIcons[weaponName] || '/images/no-image.png';
}

async function loadUserSkins() {
    try {
        const res = await fetch('/api/get-skins.php');
        const data = await res.json();
        if (data && !data.error) { userSkins = data; renderWeaponSidebar(); }
    } catch(e) {}
}

async function saveSkin(weapon, skinName, seed, wearFloat, stat) {
    try {
        const res = await fetch('/api/save-skin.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ weapon, skin: skinName, pattern: parseInt(seed), float: wearFloat, stattrak: stat ? 1 : 0 })
        });
        const data = await res.json();
        if (data.success) {
            showToast(`${stat ? '🔫 STATRAK ' : ''}${weapon} | ${skinName} применён!`);
            await loadUserSkins();
            return true;
        } else { showToast(`❌ Ошибка`); return false; }
    } catch(e) { showToast('❌ Ошибка'); return false; }
}

function renderWeaponSidebar() {
    let html = '';
    for (const [catId, cat] of Object.entries(CATEGORIES)) {
        const visible = cat.weapons.slice(0, 6);
        const hiddenList = cat.weapons.slice(6);
        const isExpanded = hiddenWeapons[catId] || false;
        const displayList = isExpanded ? cat.weapons : visible;
        html += `<div class="weapon-category">
            <div class="weapon-category-title"><i class="${cat.icon}"></i> ${cat.name}</div>
            <div class="weapon-grid">`;
        displayList.forEach(w => {
            const has = userSkins && userSkins[w];
            html += `<button class="weapon-item ${currentWeapon === w ? 'active' : ''} ${has ? 'has-skin' : ''}" data-weapon="${w}">
                <div class="weapon-icon"><img src="${getWeaponIcon(w)}" onerror="this.src='/images/no-image.png'"></div>
                <span class="weapon-name">${w}</span>
            </button>`;
        });
        html += `</div>`;
        if (hiddenList.length > 0 && !isExpanded) {
            html += `<button class="show-more-btn" data-category="${catId}"><i class="fas fa-chevron-down"></i> Скрыто ${hiddenList.length}</button>`;
        } else if (hiddenList.length > 0 && isExpanded) {
            html += `<button class="show-more-btn" data-category="${catId}"><i class="fas fa-chevron-up"></i> Скрыть</button>`;
        }
        html += `</div>`;
    }
    document.getElementById('weaponCategories').innerHTML = html;
    
    document.querySelectorAll('.weapon-item').forEach(btn => {
        btn.addEventListener('click', () => {
            const w = btn.dataset.weapon;
            if (w && weaponsList[w]) { currentWeapon = w; renderWeaponSidebar(); renderSkinsForWeapon(currentWeapon); }
        });
    });
    document.querySelectorAll('.show-more-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const cat = btn.dataset.category;
            if (cat) { hiddenWeapons[cat] = !hiddenWeapons[cat]; renderWeaponSidebar(); }
        });
    });
}

function renderSkinsForWeapon(weapon) {
    const skins = weaponsList[weapon] || [];
    document.getElementById('selectedWeaponTitle').innerHTML = `<i class="fas fa-gun"></i> ${weapon}`;
    if (!skins.length) {
        document.getElementById('skinsContainer').innerHTML = '<div class="loader-wrapper"><div class="loader-spinner"></div><p>Нет скинов</p></div>';
        return;
    }
    document.getElementById('skinsContainer').innerHTML = `<div class="skins-grid" id="skinsGrid"></div>`;
    const grid = document.getElementById('skinsGrid');
    grid.innerHTML = skins.slice(0, 50).map((s, i) => `
        <div class="skin-card" data-index="${i}">
            <div class="skin-card-image"><img src="${s.image || '/images/no-image.png'}" onerror="this.src='/images/no-image.png'"></div>
            <div class="skin-card-info">
                <div class="skin-card-name">${escapeHtml(s.name)}</div>
                <div class="skin-card-weapon">${escapeHtml(s.weapon?.name || s.weapon_name)}</div>
            </div>
        </div>
    `).join('');
    document.querySelectorAll('.skin-card').forEach(card => {
        card.addEventListener('click', () => {
            const idx = parseInt(card.dataset.index);
            if (!isNaN(idx) && skins[idx]) openModal(skins[idx]);
        });
    });
}

function openModal(skin) {
    let selectedWear = "Factory New";
    let isStatTrak = false;
    let seed = Math.floor(Math.random() * 1001);
    const modalHtml = `
        <div class="skin-modal" id="skinModal">
            <div class="skin-modal-content">
                <div class="skin-modal-header"><h3><i class="fas fa-gun"></i> Применить скин</h3><button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button></div>
                <div class="skin-modal-preview"><img src="${skin.image || '/images/no-image.png'}" onerror="this.src='/images/no-image.png'"></div>
                <div class="skin-modal-info"><h4>${escapeHtml(skin.name)}</h4><p>${escapeHtml(skin.weapon?.name || skin.weapon_name)}</p></div>
                <div class="qualities">${WEAR_NAMES.map(w => `<button class="quality-btn ${w === selectedWear ? 'active' : ''}" data-wear="${w}">${w}</button>`).join('')}</div>
                <div class="pattern-control"><label>PATTERN SEED</label><input type="number" id="patternSeed" min="0" max="1000" value="${seed}"><button class="random-pattern" id="randomPatternBtn"><i class="fas fa-random"></i></button></div>
                <button class="stattrak-btn" id="stattrakBtn"><i class="fas fa-star"></i> STATRAK™</button>
                <button class="modal-apply-btn" id="modalApplyBtn"><i class="fas fa-check-circle"></i> Применить скин</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const modal = document.getElementById('skinModal');
    document.querySelectorAll('.quality-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedWear = btn.dataset.wear;
        });
    });
    document.getElementById('randomPatternBtn').addEventListener('click', () => {
        seed = Math.floor(Math.random() * 1001);
        document.getElementById('patternSeed').value = seed;
    });
    document.getElementById('patternSeed').addEventListener('input', (e) => {
        seed = parseInt(e.target.value) || 0;
        if (seed < 0) seed = 0;
        if (seed > 1000) seed = 1000;
    });
    const stBtn = document.getElementById('stattrakBtn');
    stBtn.addEventListener('click', () => {
        isStatTrak = !isStatTrak;
        stBtn.classList.toggle('active');
        stBtn.innerHTML = `<i class="fas fa-star"></i> STATRAK™ ${isStatTrak ? '✓' : ''}`;
    });
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.remove());
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    document.getElementById('modalApplyBtn').addEventListener('click', async () => {
        const wearFloat = WEAR_VALUES[selectedWear];
        const success = await saveSkin(skin.weapon?.name || skin.weapon_name, skin.name, seed, wearFloat, isStatTrak);
        if (success) modal.remove();
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
}

function showCollection() {
    if (!userSkins || Object.keys(userSkins).length === 0) {
        showToast('Нет сохранённых скинов');
        return;
    }
    const modalHtml = `<div class="collection-modal" id="collectionModal"><div class="collection-modal-content"><div class="collection-modal-header"><h3><i class="fas fa-star"></i> Моя коллекция</h3><button class="modal-close" id="closeCollectionBtn"><i class="fas fa-times"></i></button></div><div class="collection-list" id="collectionList"></div></div></div>`;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    let html = '';
    for (const [weapon, info] of Object.entries(userSkins)) {
        html += `<div class="collection-item">
            <div class="collection-item-img"><img src="${info.image || '/images/no-image.png'}" onerror="this.src='/images/no-image.png'"></div>
            <div class="collection-item-info">
                <div class="collection-item-weapon">${escapeHtml(weapon)}</div>
                <div>${escapeHtml(info.skin_name)} ${info.stattrak ? '<span class="collection-stattrak">STATRAK™</span>' : ''}</div>
                <div style="font-size:0.65rem; color:var(--text-muted);">Seed: ${info.pattern || 0}</div>
            </div>
        </div>`;
    }
    document.getElementById('collectionList').innerHTML = html;
    document.getElementById('closeCollectionBtn').addEventListener('click', () => document.getElementById('collectionModal').remove());
    document.getElementById('collectionModal').addEventListener('click', (e) => { if (e.target === document.getElementById('collectionModal')) document.getElementById('collectionModal').remove(); });
}

loadSkins().then(() => {
    document.getElementById('collectionBtn').addEventListener('click', showCollection);
});
</script>
</body>
