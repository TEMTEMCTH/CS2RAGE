<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2RAGE — Скинченджер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/skinchanger.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<div class="skinchanger-wrapper">
    <a href="index.html" class="back-link">← Назад к серверам</a>

    <div class="skinchanger-layout">
        <div class="weapon-sidebar" id="weaponSidebar">
            <div class="sidebar-title"><i class="fas fa-gun"></i> Оружие</div>
            <div id="weaponCategories"><div class="loader-wrapper"><div class="loader-spinner"></div><p>Загрузка оружия...</p></div></div>
        </div>

        <div class="skins-content">
            <div class="content-tabs">
                <button class="content-tab-btn active" data-tab="all-skins">🎨 Все скины</button>
                <button class="content-tab-btn" data-tab="my-collection">⭐ Моя коллекция</button>
            </div>
            
            <div id="allSkinsTab">
                <div class="selected-weapon-title" id="selectedWeaponTitle">Выберите оружие</div>
                <div id="skinsContainer"><div class="loader-wrapper"><div class="loader-spinner"></div><p>Загрузка скинов...</p></div></div>
            </div>
            
            <div id="myCollectionTab" style="display:none;">
                <div class="collection-header">
                    <h3><i class="fas fa-star"></i> Моя коллекция</h3>
                    <div class="collection-actions">
                        <div class="team-switch">
                            <button class="team-switch-btn ct" data-team="ct">CT</button>
                            <button class="team-switch-btn t" data-team="t">T</button>
                            <button class="team-switch-btn both active" data-team="both">ВСЕ</button>
                        </div>
                        <button class="reset-all-btn" id="resetAllSkinsBtn"><i class="fas fa-trash-alt"></i> Сбросить все</button>
                    </div>
                </div>
                <div id="collectionContainer"><div class="loader-wrapper"><div class="loader-spinner"></div><p>Загрузка...</p></div></div>
            </div>
        </div>
    </div>
</div>

<script src="js/layout.js"></script>
<script src="js/skinchanger.js"></script>
</body>
</html>
