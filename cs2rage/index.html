<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2RAGE — Серверы Counter-Strike 2</title>
<meta name="description" content="CS2RAGE — игровой проект Counter-Strike 2. Public, AWP, Minigame, Jail, Arena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/servers.css">
<style>
    .btn-commands {
        background: var(--gradient-orange);
        border: none;
        color: var(--primary-fg);
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .btn-commands:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-orange);
    }
    
    .commands-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
    }
    .commands-modal-content {
        background: var(--card);
        border: 1px solid var(--primary);
        border-radius: 16px;
        width: 90%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
    }
    .commands-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--card);
    }
    .commands-modal-header h3 {
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--primary);
        margin: 0;
    }
    .commands-modal-close {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 1.2rem;
        cursor: pointer;
        transition: 0.2s;
    }
    .commands-modal-close:hover {
        color: var(--primary);
    }
    .commands-list {
        padding: 0 24px 20px;
    }
    .command-item {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }
    .command-item:last-child {
        border-bottom: none;
    }
    .command-cmd {
        color: var(--primary);
        font-family: monospace;
        font-weight: 600;
    }
    .command-desc {
        color: var(--muted);
    }
    
    .hero-block {
        background: linear-gradient(135deg, rgba(224,136,58,0.08), rgba(15,15,15,0.9));
        border-radius: 24px;
        padding: 2.5rem;
        margin-bottom: 2rem;
        border: 1px solid rgba(224,136,58,0.2);
    }
    .hero-stats {
        display: flex;
        justify-content: flex-end;
        gap: 1.5rem;
        margin-top: 1rem;
    }
    .mode-info-block {
        margin-bottom: 2rem;
    }
    .modes-block {
        margin-bottom: 2rem;
    }
    
    .modes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
    }
    .mode-btn {
        background: rgba(26,26,26,0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(42,42,42,0.5);
        border-radius: 16px;
        padding: 1.2rem;
        cursor: pointer;
        transition: all 0.3s;
        text-align: center;
    }
    .mode-btn:hover {
        border-color: var(--primary);
        transform: translateY(-3px);
    }
    .mode-btn.active {
        border-color: var(--primary);
        background: linear-gradient(135deg, rgba(224,136,58,0.15), rgba(26,26,26,0.7));
    }
    .mode-btn .name {
        font-family: 'Oswald', sans-serif;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 0.3rem;
    }
    .mode-btn .lbl {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 0.2rem;
    }
    
    .mode-info-card {
        background: rgba(26,26,26,0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(42,42,42,0.5);
        border-radius: 20px;
        padding: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .mode-info-card h2 {
        font-family: 'Oswald', sans-serif;
        font-size: 1.5rem;
        color: var(--primary);
    }
    .mode-info-card p {
        color: var(--muted);
    }
    
    .server-card {
        transition: all 0.3s;
    }
    .server-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px -10px rgba(224,136,58,0.3);
    }
    
    .btn-copy-ip {
        background: rgba(26,26,26,0.8);
        border: 1px solid rgba(224,136,58,0.3);
        border-radius: 30px;
        padding: 0.4rem 0.8rem;
        font-size: 0.7rem;
        color: #e8e6e3;
        cursor: pointer;
        transition: 0.2s;
        margin-left: 0.5rem;
    }
    .btn-copy-ip:hover {
        border-color: #e0883a;
        color: #e0883a;
    }
    
    .toast {
        position: fixed;
        top: 90px;
        right: 20px;
        background: #1a1a1a;
        border-left: 4px solid #e0883a;
        border-radius: 12px;
        padding: 0.8rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        z-index: 10000;
        animation: slideInRight 0.3s ease forwards;
    }
    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(50px); }
        to { opacity: 1; transform: translateX(0); }
    }
</style>
</head>
<body>

<script src="js/layout.js"></script>

<div class="container" style="max-width: 1400px; margin: 0 auto; padding: 2rem;">
    
    <div class="hero-block">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1 style="font-size: 3rem; font-family: 'Oswald', sans-serif; margin-bottom: 0.5rem;">Играй на <span style="color: #e0883a;">CS2RAGE</span></h1>
                <p style="color: #8a8a8a;">Лучшие публичные серверы Counter-Strike 2. Выбирай режим — подключайся в один клик.</p>
            </div>
            <div class="hero-stats" id="heroStats"></div>
        </div>
    </div>
    
    <div class="mode-info-block" id="modeInfoContainer"></div>
    
    <div class="modes-block">
        <div class="modes" id="modesContainer"></div>
    </div>
    
    <div class="filters" style="display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <div class="filter-group" style="display: flex; gap: 0.5rem;">
            <label class="filter" style="display: flex; align-items: center; gap: 0.5rem; background: rgba(26,26,26,0.7); padding: 0.5rem 1rem; border-radius: 30px;">
                Регион
                <select id="region" style="background: transparent; border: none; color: #e8e6e3;">
                    <option value="all">Все</option>
                    <option value="ru">Россия</option>
                    <option value="eu">Европа</option>
                </select>
            </label>
            <label class="filter" style="display: flex; align-items: center; gap: 0.5rem; background: rgba(26,26,26,0.7); padding: 0.5rem 1rem; border-radius: 30px;">
                Карта
                <select id="mapFilter" style="background: transparent; border: none; color: #e8e6e3;"></select>
            </label>
        </div>
        <input id="search" class="search" placeholder="🔍 Поиск сервера или карты..." style="background: rgba(26,26,26,0.7); border: 1px solid rgba(42,42,42,0.5); border-radius: 30px; padding: 0.5rem 1rem; color: #e8e6e3;">
    </div>
    
    <div id="serversContainer"></div>
    
</div>

<script>
// ============================================
// ДАННЫЕ СЕРВЕРОВ
// ============================================
const SERVERS = [];
let serverId = 1;

// Mirage - 10 серверов
for (let i = 1; i <= 10; i++) {
    SERVERS.push({
        id: serverId++,
        name: `CS2RAGE | MIRAGE #${i}`,
        mode: "public",
        map: "de_mirage",
        region: "ru",
        city: "Москва",
        slots: 32,
        players: i === 1 ? 0 : 0,
        status: i === 1 ? "online" : "offline",
        ip: `45.95.31.15:${27415 + i - 1}`
    });
}

// Dust2 - 5 серверов
for (let i = 1; i <= 5; i++) {
    SERVERS.push({
        id: serverId++,
        name: `CS2RAGE | DUST2 #${i}`,
        mode: "public",
        map: "de_dust2",
        region: "ru",
        city: "Москва",
        slots: 32,
        players: 0,
        status: "offline",
        ip: `45.95.31.15:${27425 + i - 1}`
    });
}

// Cache - 5 серверов
for (let i = 1; i <= 5; i++) {
    SERVERS.push({
        id: serverId++,
        name: `CS2RAGE | CACHE #${i}`,
        mode: "public",
        map: "de_cache",
        region: "ru",
        city: "Москва",
        slots: 32,
        players: 0,
        status: "offline",
        ip: `45.95.31.15:${27430 + i - 1}`
    });
}

// AWP серверы
for (let i = 1; i <= 5; i++) {
    SERVERS.push({
        id: serverId++,
        name: `CS2RAGE | AWP #${i}`,
        mode: "awp",
        map: "awp_lego",
        region: "ru",
        city: "Москва",
        slots: 20,
        players: 0,
        status: "offline",
        ip: `45.95.31.15:${27435 + i - 1}`
    });
}

// Arena серверы
for (let i = 1; i <= 5; i++) {
    SERVERS.push({
        id: serverId++,
        name: `CS2RAGE | ARENA #${i}`,
        mode: "arena",
        map: "aim_redline",
        region: "ru",
        city: "Москва",
        slots: 16,
        players: 0,
        status: "offline",
        ip: `45.95.31.15:${27440 + i - 1}`
    });
}

const MODES_LIST = [
    { id: "public", name: "PUBLIC", desc: "Классические публичные серверы CS2 — основа проекта." },
    { id: "awp", name: "AWP", desc: "AWP-only арены для любителей снайперских дуэлей." },
    { id: "arena", name: "ARENA 1V1", desc: "Дуэли 1 на 1 с системой ротации арен." }
];

const MODE_COMMANDS = {
    public: [
        { cmd: "!ws", desc: "Открыть меню скинов" },
        { cmd: "!knife", desc: "Выбрать нож" },
        { cmd: "!glove", desc: "Выбрать перчатки" },
        { cmd: "!menu", desc: "Главное меню" },
        { cmd: "!rank", desc: "Показать свой ранг" },
        { cmd: "!top", desc: "Таблица лидеров" },
        { cmd: "!votekick", desc: "Голосование за кик" },
        { cmd: "!report", desc: "Пожаловаться" }
    ],
    awp: [
        { cmd: "!ws", desc: "Выбрать скин AWP" },
        { cmd: "!knife", desc: "Выбрать нож" },
        { cmd: "!duel", desc: "Вызвать на дуэль" },
        { cmd: "!stats", desc: "Статистика дуэлей" }
    ],
    arena: [
        { cmd: "!ws", desc: "Выбрать скин" },
        { cmd: "!knife", desc: "Выбрать нож" },
        { cmd: "!accept", desc: "Принять дуэль" },
        { cmd: "!decline", desc: "Отклонить дуэль" },
        { cmd: "!stats", desc: "Статистика побед" }
    ]
};

let currentMode = "public";
let region = "all";
let mapFilter = "all";
let searchQuery = "";

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fas fa-check-circle" style="color:#e0883a;"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function copyToClipboard(ip) {
    navigator.clipboard.writeText(`connect ${ip}`);
    showToast(`IP скопирован: connect ${ip}`);
}

function connectToServer(ip) {
    window.location.href = `steam://connect/${ip}`;
}

function showCommandsModal() {
    const commands = MODE_COMMANDS[currentMode] || [];
    const modeName = MODES_LIST.find(x => x.id === currentMode)?.name || currentMode;
    
    const modalHtml = `
        <div class="commands-modal" id="commands-modal">
            <div class="commands-modal-content">
                <div class="commands-modal-header">
                    <h3><i class="fas fa-terminal"></i> ${modeName} — Команды режима</h3>
                    <button class="commands-modal-close" id="close-modal-btn"><i class="fas fa-times"></i></button>
                </div>
                <div class="commands-list">
                    ${commands.map(cmd => `
                        <div class="command-item">
                            <span class="command-cmd">${cmd.cmd}</span>
                            <span class="command-desc">${cmd.desc}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const modal = document.getElementById('commands-modal');
    document.getElementById('close-modal-btn').onclick = () => modal.remove();
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
}

function renderHeroStats() {
    const totalOnline = SERVERS.reduce((sum, s) => sum + s.players, 0);
    const totalServers = SERVERS.length;
    const onlineServers = SERVERS.filter(s => s.status === "online").length;
    document.getElementById('heroStats').innerHTML = `
        <div class="stat" style="background: rgba(26,26,26,0.5); padding: 0.8rem 1.5rem; border-radius: 16px; text-align: center;">
            <b style="font-size: 1.5rem; color: #e0883a;">${totalOnline}</b>
            <span style="font-size: 0.7rem; display: block; color: #8a8a8a;">ИГРОКОВ</span>
        </div>
        <div class="stat" style="background: rgba(26,26,26,0.5); padding: 0.8rem 1.5rem; border-radius: 16px; text-align: center;">
            <b style="font-size: 1.5rem; color: #e0883a;">${totalServers}</b>
            <span style="font-size: 0.7rem; display: block; color: #8a8a8a;">СЕРВЕРОВ</span>
        </div>
        <div class="stat" style="background: rgba(26,26,26,0.5); padding: 0.8rem 1.5rem; border-radius: 16px; text-align: center;">
            <b style="font-size: 1.5rem; color: #e0883a;">24/7</b>
            <span style="font-size: 0.7rem; display: block; color: #8a8a8a;">АПТАЙМ</span>
        </div>
    `;
}

function renderModeInfo() {
    const mode = MODES_LIST.find(m => m.id === currentMode);
    const container = document.getElementById('modeInfoContainer');
    container.innerHTML = `
        <div class="mode-info-card">
            <div>
                <h2><i class="fas fa-tachometer-alt"></i> ${mode.name}</h2>
                <p>${mode.desc}</p>
            </div>
            <button class="btn-commands" id="modeCommandsBtn">
                <i class="fas fa-terminal"></i> Команды режима
            </button>
        </div>
    `;
    document.getElementById('modeCommandsBtn')?.addEventListener('click', showCommandsModal);
}

function renderModes() {
    const container = document.getElementById('modesContainer');
    container.innerHTML = MODES_LIST.map(mode => {
        const count = SERVERS.filter(s => s.mode === mode.id).length;
        return `
            <button class="mode-btn ${currentMode === mode.id ? 'active' : ''}" data-mode="${mode.id}">
                <div class="name">${mode.name}</div>
                <div class="lbl">режим</div>
            </button>
        `;
    }).join('');
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentMode = btn.dataset.mode;
            mapFilter = "all";
            renderModes();
            renderModeInfo();
            renderFilters();
            renderServers();
        });
    });
}

function renderFilters() {
    const modeServers = SERVERS.filter(s => s.mode === currentMode);
    const maps = [...new Set(modeServers.map(s => s.map))];
    const select = document.getElementById('mapFilter');
    select.innerHTML = `<option value="all">Все карты</option>` + 
        maps.map(m => `<option value="${m}">${m.replace('de_', '').replace('awp_', '').replace('aim_', '').toUpperCase()}</option>`).join('');
}

function renderServers() {
    let servers = SERVERS.filter(s => s.mode === currentMode);
    
    if (region !== 'all') {
        servers = servers.filter(s => s.region === region);
    }
    if (mapFilter !== 'all') {
        servers = servers.filter(s => s.map === mapFilter);
    }
    if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        servers = servers.filter(s => s.name.toLowerCase().includes(q) || s.map.toLowerCase().includes(q));
    }
    
    const grouped = {};
    servers.forEach(s => {
        const mapKey = s.map;
        if (!grouped[mapKey]) grouped[mapKey] = [];
        grouped[mapKey].push(s);
    });
    
    const container = document.getElementById('serversContainer');
    if (Object.keys(grouped).length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 3rem; color: #8a8a8a;">😔 Серверов не найдено</div>';
        return;
    }
    
    let html = '';
    for (const [map, mapServers] of Object.entries(grouped)) {
        const mapDisplay = map.replace('de_', '').replace('awp_', '').replace('aim_', '').toUpperCase();
        html += `
            <div class="map-group" style="margin-bottom: 2rem;">
                <div class="map-head" style="display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(42,42,42,0.5); padding-bottom: 0.5rem;">
                    <h3 style="font-size: 1.3rem; text-transform: uppercase; color: #e0883a;">${mapDisplay}</h3>
                    <span style="font-size: 0.75rem; color: #8a8a8a;">(${mapServers.length} серверов)</span>
                </div>
                <div class="servers-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem;">
                    ${mapServers.map(s => `
                        <div class="server-card" style="background: rgba(26,26,26,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(42,42,42,0.5); border-radius: 16px; padding: 1rem; transition: 0.3s;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                <div class="name" style="font-weight: 700;">${s.name}</div>
                                <div>
                                    <button class="btn-copy-ip" onclick="copyToClipboard('${s.ip}')" title="Скопировать IP"><i class="fas fa-copy"></i></button>
                                    <button class="btn-copy-ip" onclick="connectToServer('${s.ip}')" style="margin-left: 0.3rem;" title="Подключиться"><i class="fas fa-plug"></i></button>
                                </div>
                            </div>
                            <div class="meta" style="font-size: 0.7rem; color: #e0883a; text-transform: uppercase; margin-bottom: 0.5rem;">${mapDisplay} · ${s.city}</div>
                            <div class="players-bar" style="height: 4px; background: rgba(42,42,42,0.5); border-radius: 2px; margin: 0.5rem 0;">
                                <div style="width: ${(s.players / s.slots) * 100}%; height: 100%; background: linear-gradient(135deg, #c0702a, #f0a050); border-radius: 2px;"></div>
                            </div>
                            <div class="players-info" style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #8a8a8a;">
                                <span>Игроки</span>
                                <span><b>${s.players}</b> / ${s.slots}</span>
                            </div>
                            <div class="server-status" style="margin-top: 0.5rem; font-size: 0.65rem; color: ${s.status === 'online' ? '#00c853' : '#e34d4d'};">
                                ${s.status === 'online' ? '● ONLINE' : '● OFFLINE'}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    container.innerHTML = html;
}

// ОБНОВЛЕНИЕ РЕАЛЬНОГО ОНЛАЙНА (исправленная версия)
async function updateRealOnline() {
    try {
        const response = await fetch('/api/get-servers-status.php');
        const data = await response.json();
        
        if (data.success && data.servers.length > 0) {
            const serverData = data.servers[0];
            // Обновляем только сервер Mirage #1 (id = 1)
            const serverIndex = SERVERS.findIndex(s => s.id === 1);
            if (serverIndex !== -1) {
                SERVERS[serverIndex].players = serverData.players;
                SERVERS[serverIndex].status = serverData.status;
                SERVERS[serverIndex].map = serverData.map;
                SERVERS[serverIndex].slots = serverData.max_players || 32;
            }
            // Обновляем общую статистику
            renderHeroStats();
            // Перерисовываем серверы
            renderServers();
        }
    } catch (error) {
        console.error('Ошибка загрузки статуса сервера:', error);
    }
}

// ИНИЦИАЛИЗАЦИЯ
document.addEventListener('DOMContentLoaded', () => {
    renderHeroStats();
    renderModeInfo();
    renderModes();
    renderFilters();
    renderServers();
    updateRealOnline();
    setInterval(updateRealOnline, 30000);
    
    document.getElementById('region').addEventListener('change', (e) => {
        region = e.target.value;
        renderServers();
    });
    document.getElementById('mapFilter').addEventListener('change', (e) => {
        mapFilter = e.target.value;
        renderServers();
    });
    document.getElementById('search').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderServers();
    });
});
</script>
</body>
</html>
