<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2RAGE — Серверы Counter-Strike 2</title>
<meta name="description" content="CS2RAGE — игровой проект Counter-Strike 2. Public, AWP, Minigame, Jail, Arena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/servers.css">
<link rel="stylesheet" href="css/index.css">
<link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<script src="js/layout.js"></script>

<div class="container">
    <div class="hero-block">
        <div class="hero-content">
            <div class="hero-text">
                <h1>Играй на <span class="hero-highlight">CS2RAGE</span></h1>
                <p>Лучшие публичные серверы Counter-Strike 2. Выбирай режим — подключайся в один клик.</p>
            </div>
            <div class="hero-actions">
                <div class="hero-stats" id="heroStats"></div>
                <button class="btn-commands" id="heroCommandsBtn"><i class="fas fa-terminal"></i> Команды</button>
            </div>
        </div>
    </div>
    
<div class="modes-block">
    <div class="modes" id="modesContainer"></div>
    <div id="modeInfoContainer" style="display:none;"></div>
</div>
    
    <div class="filters">
        <div class="filter-group">
            <label class="filter">Регион <select id="region"><option value="all">Все</option><option value="ru">Россия</option><option value="eu">Европа</option></select></label>
            <label class="filter">Карта <select id="mapFilter"></select></label>
        </div>
        <input id="search" class="search" placeholder="🔍 Поиск сервера или карты...">
    </div>
    
    <div id="serversContainer"></div>
</div>

<script src="js/servers.js"></script>
</body>
</html>
