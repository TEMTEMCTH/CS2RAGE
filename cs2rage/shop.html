<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2RAGE — Привилегии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .shop-container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .page-title { text-align: center; margin-bottom: 3rem; }
        .page-title h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--primary); }
        .page-title p { color: var(--muted); }
        
        .tiers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .tier {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 1.8rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* ОБВОДКА СВОИМ ЦВЕТОМ У КАЖДОЙ КАРТОЧКИ */
        .tier.basic {
            border: 2px solid rgba(196,196,196,0.5);
        }
        .tier.lite {
            border: 2px solid rgba(58,163,255,0.5);
        }
        .tier.premium {
            border: 2px solid rgba(240,160,80,0.5);
        }
        .tier.king {
            border: 2px solid rgba(255,215,0,0.5);
        }
        .tier.god {
            border: 2px solid rgba(255,51,51,0.5);
        }
        
        /* При наведении обводка становится ярче */
        .tier.basic:hover {
            border-color: #c4c4c4;
            box-shadow: 0 0 25px rgba(196,196,196,0.8), 0 20px 40px -15px rgba(196,196,196,0.5);
        }
        .tier.lite:hover {
            border-color: #3aa3ff;
            box-shadow: 0 0 25px rgba(58,163,255,0.8), 0 20px 40px -15px rgba(58,163,255,0.5);
        }
        .tier.premium:hover {
            border-color: #f0a050;
            box-shadow: 0 0 30px rgba(240,160,80,0.9), 0 20px 40px -15px rgba(240,160,80,0.6);
        }
        .tier.king:hover {
            border-color: #ffd700;
            box-shadow: 0 0 35px rgba(255,215,0,0.9), 0 20px 40px -15px rgba(255,215,0,0.6);
        }
        .tier.god:hover {
            border-color: #ff3333;
            box-shadow: 0 0 35px rgba(255,51,51,0.9), 0 20px 40px -15px rgba(255,51,51,0.6);
        }
        
        .tier:hover {
            transform: translateY(-8px);
        }
        
        .tier.featured {
            background: linear-gradient(135deg, rgba(224,136,58,0.1), rgba(26,26,26,0.9));
        }
        
        .tier-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(66,66,66,0.5);
        }
        
        /* Названия привилегий */
        .tier-name.basic {
            background: linear-gradient(135deg, #8a8a8a, #c4c4c4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tier-name.lite {
            background: linear-gradient(135deg, #3aa3ff, #8de1ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tier-name.premium {
            background: linear-gradient(135deg, #f0a050, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(240,160,80,0.5);
        }
        .tier-name.king {
            background: linear-gradient(135deg, #ffd700, #ffed4a, #ffb800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .tier-name.god {
            background: linear-gradient(135deg, #ff3333, #ff0000, #cc0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        
        .tier-name {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        /* Цены под цвет привилегий */
        .tier-price.basic {
            color: #c4c4c4;
        }
        .tier-price.lite {
            color: #3aa3ff;
        }
        .tier-price.premium {
            color: #f0a050;
            text-shadow: 0 0 15px rgba(240,160,80,0.5);
        }
        .tier-price.king {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .tier-price.god {
            color: #ff3333;
            text-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        
        .tier-price {
            margin-top: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .tier-price small {
            font-size: 0.8rem;
            color: var(--muted);
        }
        
        .tier-price .old-price {
            font-size: 0.9rem;
            text-decoration: line-through;
            color: #e34d4d;
            margin-right: 0.5rem;
        }
        
        .tier-price .new-price {
            font-size: 1.8rem;
        }
        
        .tier-perks {
            flex: 1;
            margin: 1rem 0;
            list-style: none;
        }
        
        .tier-perks li {
            padding: 0.5rem 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px dashed rgba(66,66,66,0.2);
        }
        
        .tier-perks li i {
            color: var(--primary);
            width: 20px;
            font-size: 0.8rem;
        }
        
        .buy-btn {
            background: linear-gradient(135deg, #c0702a, #f0a050);
            border: none;
            border-radius: 40px;
            padding: 0.8rem;
            color: #1a1a1a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            margin-top: 1rem;
            width: 100%;
        }
        
        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(224,136,58,0.4);
        }
        
        .period-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
        }
        .period-modal-content {
            background: rgba(26,26,26,0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            padding: 1.5rem;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .period-user-balance {
            background: rgba(15,15,15,0.8);
            border-radius: 12px;
            padding: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .period-user-balance span { color: var(--primary); font-weight: 700; }
        .period-btn {
            background: rgba(15,15,15,0.8);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 0.7rem;
            margin: 0.5rem 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }
        .period-btn:hover { border-color: var(--primary); background: rgba(224,136,58,0.1); }
        .period-btn.selected { border-color: var(--primary); background: rgba(224,136,58,0.2); }
        .period-price { color: var(--primary); font-weight: 700; }
        .old-price { text-decoration: line-through; font-size: 0.7rem; color: var(--muted); margin-right: 0.3rem; }
        .confirm-btn {
            background: linear-gradient(135deg, #c0702a, #f0a050);
            border: none;
            border-radius: 40px;
            padding: 0.7rem;
            margin-top: 1rem;
            width: 100%;
            color: #1a1a1a;
            font-weight: 700;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            top: 90px;
            right: 20px;
            background: #1a1a1a;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            z-index: 10000;
            animation: slideInRight 0.3s ease;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @media (max-width: 768px) {
            .tiers { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<script src="js/layout.js"></script>

<div class="shop-container">
    <div class="page-title">
        <h1>ПРИВИЛЕГИИ CS2RAGE</h1>
        <p>Поддержи проект и получи плюшки на серверах. 5 привилегий — на любой вкус.</p>
    </div>
    <div class="tiers" id="tiers"></div>
</div>

<script>
(function() {
    var TIERS_DATA = [
        {
            id: "basic",
            name: "BASIC",
            basePrice: 99,
            featured: false,
            perks: ["Цветной ник в чате", "Резерв-слот при заполнении сервера", "Доступ к голосованиям", "Иконка BASIC рядом с ником"]
        },
        {
            id: "lite",
            name: "LITE",
            basePrice: 199,
            featured: false,
            perks: ["Все привилегии BASIC", "Скинченджер (10 скинов)", "Граффити в чате", "Команда !ws — выбор скина оружия", "Приоритет в очереди"]
        },
        {
            id: "premium",
            name: "PREMIUM",
            basePrice: 399,
            featured: true,
            perks: ["Все привилегии LITE", "Полный доступ к скинченджеру (все скины)", "Скины ножей и перчаток", "Кастомные паттерны (Seed)", "Настройка износа (Float)", "+30% к опыту"]
        },
        {
            id: "king",
            name: "KING",
            basePrice: 699,
            featured: false,
            perks: ["Все привилегии PREMIUM", "Кастомный плеймодель", "Команда !knife в любой момент", "Личный значок KING в TAB", "Быстрый коннект в любой момент", "+60% к опыту"]
        },
        {
            id: "god",
            name: "GOD",
            basePrice: 1299,
            featured: false,
            perks: ["Все привилегии KING", "Базовые команды модерации (!kick, !mute)", "Доступ в закрытый Discord-канал", "Эксклюзивные стикеры и медальки", "Приоритет рассмотрения заявок", "+100% к опыту, личное обращение в поддержке"]
        }
    ];

    var currentUser = null;
    var currentBalance = 0;

    async function checkAuth() {
        try {
            var res = await fetch('/api/check-auth.php');
            var data = await res.json();
            if (data.authenticated && data.user) {
                currentUser = data.user;
                var balanceRes = await fetch('/api/get-balance.php');
                var balanceData = await balanceRes.json();
                currentBalance = balanceData.success ? balanceData.balance : 0;
                return true;
            }
            return false;
        } catch(e) {
            console.error(e);
            return false;
        }
    }

    function showToast(message, isError) {
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isError ? '#e34d4d' : '#e0883a';
        toast.innerHTML = '<i class="fas ' + (isError ? 'fa-exclamation-circle' : 'fa-check-circle') + '"></i><div>' + message + '</div>';
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
    }

    async function purchasePrivilege(tierId, days, price) {
        if (!currentUser) {
            showToast('Сначала авторизуйтесь через Steam', true);
            return false;
        }
        if (currentBalance < price) {
            showToast('Недостаточно средств! Нужно ' + price + ' ₽, у вас ' + currentBalance + ' ₽', true);
            return false;
        }
        try {
            var res = await fetch('/api/buy-privilege.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tier: tierId,
                    days: days,
                    price: price,
                    steamid: currentUser.steamid
                })
            });
            var data = await res.json();
            if (data.success) {
                currentBalance -= price;
                showToast('✅ Привилегия активирована на ' + days + ' дней!', false);
                return true;
            } else {
                showToast(data.error || 'Ошибка активации', true);
                return false;
            }
        } catch(e) {
            showToast('Ошибка соединения', true);
            return false;
        }
    }

    function getPeriods(basePrice) {
        var weekPrice = basePrice;
        var monthPrice = basePrice * 3;
        var yearOriginalPrice = basePrice * 12;
        var yearDiscountPrice = basePrice * 10;
        return [
            { id: "week", days: 7, price: weekPrice, label: "Неделя (7 дней)", showOldPrice: false },
            { id: "month", days: 30, price: monthPrice, label: "Месяц (30 дней)", showOldPrice: false },
            { id: "year", days: 365, price: yearDiscountPrice, originalPrice: yearOriginalPrice, label: "Год (365 дней)", showOldPrice: true }
        ];
    }

    function showPeriodModal(tier) {
        if (!currentUser) {
            showToast('Сначала авторизуйтесь через Steam', true);
            return;
        }
        var periods = getPeriods(tier.basePrice);
        var selectedPeriod = periods[0];
        
        var modalHtml = '<div class="period-modal" id="periodModal"><div class="period-modal-content"><button class="modal-close" id="closePeriodModal"><i class="fas fa-times"></i></button><h3 style="color:var(--primary);text-align:center;"><i class="fas fa-crown"></i> ' + tier.name + '</h3><div class="period-user-balance">💰 Баланс: <span>' + currentBalance.toLocaleString() + ' ₽</span></div>';
        for (var i = 0; i < periods.length; i++) {
            var p = periods[i];
            modalHtml += '<button class="period-btn" data-days="' + p.days + '" data-price="' + p.price + '">';
            modalHtml += '<span>📅 ' + p.label + '</span>';
            modalHtml += '<span class="period-price">';
            if (p.showOldPrice && p.originalPrice) {
                modalHtml += '<span class="old-price">' + p.originalPrice + ' ₽</span>';
                modalHtml += '<span class="new-price">' + p.price + ' ₽</span>';
            } else {
                modalHtml += p.price + ' ₽';
            }
            modalHtml += '</span></button>';
        }
        modalHtml += '<button class="confirm-btn" id="confirmPurchaseBtn">Купить</button></div></div>';
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        var btns = document.querySelectorAll('.period-btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function(e) {
                var allBtns = document.querySelectorAll('.period-btn');
                for (var j = 0; j < allBtns.length; j++) {
                    allBtns[j].classList.remove('selected');
                }
                this.classList.add('selected');
                selectedPeriod = {
                    days: parseInt(this.dataset.days),
                    price: parseInt(this.dataset.price)
                };
            });
        }
        if (btns.length > 0) btns[0].classList.add('selected');
        
        document.getElementById('confirmPurchaseBtn').onclick = function() {
            document.getElementById('periodModal').remove();
            purchasePrivilege(tier.id, selectedPeriod.days, selectedPeriod.price);
        };
        document.getElementById('closePeriodModal').onclick = function() { document.getElementById('periodModal').remove(); };
        document.getElementById('periodModal').onclick = function(e) { if (e.target === this) this.remove(); };
    }

    function renderTiers() {
        var container = document.getElementById('tiers');
        if (!container) return;
        var html = '';
        for (var i = 0; i < TIERS_DATA.length; i++) {
            var t = TIERS_DATA[i];
            var perksHtml = '';
            for (var j = 0; j < t.perks.length; j++) {
                perksHtml += '<li><i class="fas fa-check-circle"></i> ' + t.perks[j] + '</li>';
            }
            html += '<div class="tier ' + t.id + ' ' + (t.featured ? 'featured' : '') + '">';
            html += '<div class="tier-header">';
            html += '<div class="tier-name ' + t.id + '">' + t.name + '</div>';
            html += '<div class="tier-price ' + t.id + '">' + t.basePrice + ' ₽<small>/мес</small></div>';
            html += '</div>';
            html += '<ul class="tier-perks">' + perksHtml + '</ul>';
            html += '<button class="buy-btn" data-tier-id="' + t.id + '">Купить</button>';
            html += '</div>';
        }
        container.innerHTML = html;
        
        var btns = document.querySelectorAll('.buy-btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function(e) {
                var tierId = this.dataset.tierId;
                var tier = null;
                for (var j = 0; j < TIERS_DATA.length; j++) {
                    if (TIERS_DATA[j].id === tierId) {
                        tier = TIERS_DATA[j];
                        break;
                    }
                }
                if (tier) showPeriodModal(tier);
            });
        }
    }

    async function init() {
        await checkAuth();
        renderTiers();
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
