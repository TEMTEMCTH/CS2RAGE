<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — CS2RAGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<script src="js/layout.js"></script>

<div class="admin-container">
    <div id="loginScreen" class="login-card">
        <div class="admin-card">
            <div class="admin-icon"><i class="fas fa-lock"></i></div>
            <h1>Админ-панель</h1>
            <p>Управление серверами и балансом</p>
            <div class="admin-field">
                <input type="password" id="adminPassword" class="admin-input" placeholder="Введите пароль" autocomplete="off">
            </div>
            <button class="admin-btn" id="loginBtn"><i class="fas fa-arrow-right"></i> Войти</button>
            <p class="admin-error" id="loginError">Неверный пароль</p>
        </div>
    </div>
    
    <div id="adminPanel" style="display:none;">
        <div class="tabs">
            <button class="tab-btn active" data-tab="users">👥 Управление балансом</button>
            <button class="tab-btn" data-tab="servers">🖥️ Управление серверами</button>
        </div>
        
        <div id="usersTab" class="tab-content active">
            <div class="admin-card">
                <h2>👥 Управление балансом пользователей <button class="admin-btn-small" id="refreshUsersBtn"><i class="fas fa-sync-alt"></i> Обновить</button></h2>
                <input type="text" id="searchUser" class="admin-input" placeholder="🔍 Поиск по нику или SteamID...">
                <div id="usersList" class="users-list"><div class="loading-text"><i class="fas fa-spinner fa-pulse"></i> Загрузка пользователей...</div></div>
            </div>
        </div>
        
        <div id="serversTab" class="tab-content">
            <div class="admin-card">
                <h2><i class="fas fa-plus-circle"></i> Добавить сервер</h2>
                <div class="admin-form">
                    <div class="admin-row">
                        <input type="text" id="srvName" class="admin-input" placeholder="Название сервера" style="flex:2">
                        <select id="srvMode" class="admin-input" style="flex:1">
                            <option value="public">Public</option>
                            <option value="awp">AWP</option>
                            <option value="arena">Arena 1v1</option>
                        </select>
                    </div>
                    <div class="admin-row">
                        <input type="text" id="srvMap" class="admin-input" placeholder="Карта (например de_mirage)" style="flex:1">
                        <select id="srvRegion" class="admin-input" style="flex:1">
                            <option value="ru">Россия</option>
                            <option value="eu">Европа</option>
                        </select>
                        <input type="text" id="srvCity" class="admin-input" placeholder="Город" style="flex:1">
                    </div>
                    <div class="admin-row">
                        <input type="number" id="srvSlots" class="admin-input" placeholder="Слотов" value="32" style="flex:1">
                        <input type="number" id="srvPlayers" class="admin-input" placeholder="Игроков онлайн" value="0" style="flex:1">
                        <select id="srvStatus" class="admin-input" style="flex:1">
                            <option value="online">Online</option>
                            <option value="offline" selected>Offline</option>
                        </select>
                    </div>
                    <input type="text" id="srvIp" class="admin-input" placeholder="IP:Port (например 45.95.31.15:27015)">
                    <button class="admin-btn" id="addServerBtn"><i class="fas fa-plus"></i> Добавить сервер</button>
                </div>
            </div>
            
            <div class="admin-card">
                <h2><i class="fas fa-list"></i> Список серверов (<span id="serversCount">0</span>)</h2>
                <input type="text" id="searchServer" class="admin-input" placeholder="🔍 Поиск по названию...">
                <div id="serversList" class="users-list"></div>
            </div>
        </div>
    </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
